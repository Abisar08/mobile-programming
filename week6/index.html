<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple-deep:   #3b0764;
      --purple-dark:   #581c87;
      --purple-mid:    #7e22ce;
      --purple-light:  #a855f7;
      --purple-pale:   #f3e8ff;
      --purple-ghost:  #faf5ff;
      --white:         #ffffff;
      --text-main:     #1e0a2e;
      --text-body:     #4b2569;
      --text-muted:    #9333ea;
      --border:        #d8b4fe;
      --error-bg:      #fff1f2;
      --error-border:  #fca5a5;
      --error-text:    #7f1d1d;
      --success-bg:    #f0fdf4;
      --success-border:#86efac;
      --success-text:  #14532d;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-dark) 40%, var(--purple-mid) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--white);
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(168,85,247,0.12),
        0 24px 64px rgba(59,7,100,0.35),
        0 8px 24px rgba(59,7,100,0.2);
    }

    /* ── header band ── */
    .card-header {
      background: linear-gradient(135deg, var(--purple-deep) 0%, var(--purple-mid) 100%);
      padding: 2.25rem 2.25rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    }
    .card-header::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -20px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    .header-icon {
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      backdrop-filter: blur(4px);
    }
    .header-icon svg { color: white; }
    .card-header h1 {
      color: var(--white);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .card-header p {
      color: rgba(255,255,255,0.7);
      font-size: 0.875rem;
      margin-top: 0.35rem;
      font-weight: 400;
    }

    /* ── form body ── */
    .card-body { padding: 2rem 2.25rem 2.25rem; }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-body);
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, textarea {
      width: 100%;
      padding: 0.72rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      background: var(--purple-ghost);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    input::placeholder, textarea::placeholder { color: #c4a8e0; }
    input:focus, textarea:focus {
      border-color: var(--purple-light);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
    }
    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.55;
    }

    /* ── submit button ── */
    .btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple-mid) 100%);
      color: var(--white);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.12s, box-shadow 0.18s;
      box-shadow: 0 4px 14px rgba(126,34,206,0.38);
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(126,34,206,0.45);
    }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* spinner */
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── status message ── */
    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
      align-items: flex-start; gap: 0.5rem;
      line-height: 1.45;
    }
    #status.success {
      display: flex;
      background: var(--success-bg);
      border: 1.5px solid var(--success-border);
      color: var(--success-text);
    }
    #status.error {
      display: flex;
      background: var(--error-bg);
      border: 1.5px solid var(--error-border);
      color: var(--error-text);
    }
    #status svg { flex-shrink: 0; margin-top: 1px; }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: var(--purple-pale);
      margin: 1.5rem 0 1.25rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5A2.25 2.25 0 012.25 17.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5H4.5A2.25 2.25 0 002.25 6.75m19.5 0l-9.75 6.75L2.25 6.75"/>
      </svg>
    </div>
    <h1>Get in Touch</h1>
    <p>We'll get back to you as soon as possible.</p>
  </div>

  <div class="card-body">
    <div class="field">
      <label for="name">Full Name</label>
      <input id="name" type="text" placeholder="Jane Smith" />
    </div>

    <div class="field">
      <label for="email">Email Address</label>
      <input id="email" type="email" placeholder="jane@example.com" />
    </div>

    <div class="field">
      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" placeholder="+1 (555) 000-0000" />
    </div>

    <div class="divider"></div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" placeholder="Tell us how we can help…"></textarea>
    </div>

    <button class="btn" id="submitBtn" onclick="submitForm()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Send Message</span>
    </button>

    <div id="status" role="alert"></div>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
  // ── Firebase initialisation ──────────────────────────────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyCftOZTYHAX2viJZn5qMMO5mNv0ZwCcuTM",
    authDomain:        "mobile-programming-9adc0.firebaseapp.com",
    projectId:         "mobile-programming-9adc0",
    storageBucket:     "mobile-programming-9adc0.firebasestorage.app",
    messagingSenderId: "173192569288",
    appId:             "1:173192569288:web:850535c0360304e900a0fd",
    databaseURL:       "https://mobile-programming-9adc0-default-rtdb.firebaseio.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ── Helpers ──────────────────────────────────────────────────────────────
  function setStatus(type, html) {
    const el = document.getElementById('status');
    el.className = type;

    const icon = type === 'success'
      ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
           <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
         </svg>`
      : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
              viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
           <path stroke-linecap="round" stroke-linejoin="round"
                 d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
         </svg>`;

    el.innerHTML = icon + `<span>${html}</span>`;
  }

  function clearStatus() {
    const el = document.getElementById('status');
    el.className = '';
    el.innerHTML = '';
  }

  function setLoading(loading) {
    const btn     = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');

    btn.disabled          = loading;
    spinner.style.display = loading ? 'block' : 'none';
    btnText.textContent   = loading ? 'Sending…' : 'Send Message';
  }

  // ── Main submit function (global, called by onclick) ─────────────────────
  function submitForm() {
    clearStatus();

    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const message = document.getElementById('message').value.trim();

    // Basic validation
    if (!name || !email || !message) {
      setStatus('error', 'Please fill in your name, email, and message.');
      return;
    }

    const data = {
      name,
      email,
      phone,
      message,
      submittedAt: new Date().toISOString()
    };

    // Log before saving
    console.log('Submitting contact form data:', data);

    setLoading(true);

    db.ref('contacts').push(data)
      .then(() => {
        console.log('✅ Data saved successfully to Firebase.');
        setStatus('success', 'Your message was sent — we\'ll be in touch soon!');
        // Clear form
        ['name', 'email', 'phone', 'message'].forEach(id => {
          document.getElementById(id).value = '';
        });
      })
      .catch(err => {
        console.error('❌ Firebase save error:', err);
        setStatus('error', 'Something went wrong. Please try again later.');
      })
      .finally(() => {
        setLoading(false);
      });
  }
</script>

</body>
</html>
