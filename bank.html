<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Bank</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        input[type="number"] {
            width: 200px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
        }
        .withdraw-btn {
            background: #e74c3c;
            color: white;
        }
        .withdraw-btn:hover {
            background: #c0392b;
        }
        .deposit-btn {
            background: #27ae60;
            color: white;
        }
        .deposit-btn:hover {
            background: #229954;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .pin-input {
            width: 150px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 3px;
        }
        .pin-input:focus {
            outline: none;
            border-color: #667eea;
        }
        .confirm-btn {
            background: #3498db;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }
        @media (max-width: 480px) {
            .buttons {
                flex-direction: column;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="bank-name"> Nepal Bank</div>
        <div class="balance" id="balance">Balance: $10,000</div>
        <input type="number" id="amountInput" placeholder="Enter amount" min="0">
        <div class="buttons">
            <button class="withdraw-btn" onclick="showPinModal('withdraw')">Withdraw</button>
            <button class="deposit-btn" onclick="showPinModal('deposit')">Deposit</button>
        </div>
    </div>

    <!-- PIN Modal -->
    <div id="pinModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Enter PIN to Withdraw</h3>
            <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="****">
            <br>
            <button class="confirm-btn" onclick="confirmTransaction()">Confirm</button>
            <div class="error" id="errorMsg"></div>
            <div class="success" id="successMsg"></div>
        </div>
    </div>

    <script src="bank_script.js"></script>
