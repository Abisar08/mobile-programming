<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Bank</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Font Awesome for Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
        }

        .bank-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .balance-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .balance {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .eye-icon {
            font-size: 24px;
            cursor: pointer;
            color: #333;
        }

        input[type="number"] {
            width: 200px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            display: none; /* hidden first */
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            min-width: 120px;
        }

        .withdraw-btn {
            background: #e74c3c;
            color: white;
        }

        .deposit-btn {
            background: #27ae60;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 300px;
        }

        .pin-input {
            width: 150px;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            letter-spacing: 3px;
        }

        .confirm-btn {
            background: #3498db;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }

        .success {
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="bank-name">Nepal Bank</div>

    <!-- Balance + Eye Icon -->
    <div class="balance-box">
        <div class="balance" id="balanceText">Balance: ****</div>
        <i class="fa-solid fa-eye-slash eye-icon" id="toggleEye"></i>
    </div>

    <!-- Amount input hidden first -->
    <input type="number" id="amountInput" placeholder="Enter amount" min="1">

    <div class="buttons">
        <button class="withdraw-btn" id="withdrawBtn">Withdraw</button>
        <button class="deposit-btn" id="depositBtn">Deposit</button>
    </div>
</div>

<!-- PIN Modal -->
<div id="pinModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">Enter PIN</h3>

        <input 
            type="password" 
            class="pin-input" 
            id="pinInput" 
            maxlength="4" 
            placeholder="****"
        >

        <br>

        <button class="confirm-btn" id="confirmBtn">Confirm</button>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
    </div>
</div>

<script>
$(document).ready(function () {

    let balance = 10000;
    let isVisible = false;
    let actionType = "";

    // Toggle eye icon + balance show/hide
    $("#toggleEye").click(function () {
        if (isVisible) {
            $("#balanceText").text("Balance: ****");
            $(this)
                .removeClass("fa-eye")
                .addClass("fa-eye-slash");
            isVisible = false;
        } else {
            $("#balanceText").text("Balance: $" + balance);
            $(this)
                .removeClass("fa-eye-slash")
                .addClass("fa-eye");
            isVisible = true;
        }
    });

    // Show input field when clicking Withdraw
    $("#withdrawBtn").click(function () {
        $("#amountInput").show().focus();
        actionType = "withdraw";
        $("#modalTitle").text("Enter PIN to Withdraw");
    });

    // Show input field when clicking Deposit
    $("#depositBtn").click(function () {
        $("#amountInput").show().focus();
        actionType = "deposit";
        $("#modalTitle").text("Enter PIN to Deposit");
    });

    // Confirm transaction
    $("#confirmBtn").click(function () {
        let amount = parseFloat($("#amountInput").val());
        let pin = $("#pinInput").val();

        $("#errorMsg").hide();
        $("#successMsg").hide();

        if (!amount || amount <= 0) {
            $("#errorMsg").text("Enter valid amount").show();
            return;
        }

        if (pin !== "1234") {
            $("#errorMsg").text("Incorrect PIN").show();
            return;
        }

        if (actionType === "withdraw") {
            if (amount > balance) {
                $("#errorMsg").text("Insufficient Balance").show();
                return;
            }
            balance -= amount;
            $("#successMsg").text("Withdraw Successful").show();
        }

        if (actionType === "deposit") {
            balance += amount;
            $("#successMsg").text(" Deposit Successful").show();
        }

        // Update balance if visible
        if (isVisible) {
            $("#balanceText").text("Balance: $" + balance);
        }

        setTimeout(function () {
            $("#pinModal").hide();
            $("#pinInput").val("");
            $("#amountInput").val("").hide();
            $("#errorMsg").hide();
            $("#successMsg").hide();
        }, 1500);
    });

    // Open modal when amount entered after selecting action
    $("#amountInput").on("change", function () {
        if ($(this).val() !== "") {
            $("#pinModal").show();
        }
    });

});
</script>

</body>
</html>
